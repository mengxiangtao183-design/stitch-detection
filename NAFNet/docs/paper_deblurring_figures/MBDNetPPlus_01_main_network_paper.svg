<svg xmlns="http://www.w3.org/2000/svg" width="5300" height="2300" viewBox="0 0 5300 2300">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 Z" fill="#30343b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#56606b" flood-opacity="0.18"/>
    </filter>
    <style>
      .txt{font-family:'Times New Roman','Noto Serif SC',serif;fill:#20242a}
      .title{font-size:58px;font-weight:700}.subtitle{font-size:28px}.stage{font-size:29px;font-weight:700}.label{font-size:23px}.small{font-size:19px}.tiny{font-size:17px}
      .lane{fill:#fbfcfe;stroke:#c5ccd5;stroke-width:2;stroke-dasharray:10 9}.group{fill:#ffffff;stroke-width:2.4;rx:18}
      .enc0{stroke:#6ba7cc}.enc1{stroke:#df9369}.bottle{stroke:#d2a62c}.decoder{stroke:#c98968}
      .conv{fill:#cfe8f6;stroke:#4f8fb3;stroke-width:2.5}.down{fill:#e6daf1;stroke:#8d6aa3;stroke-width:2.5}.up{fill:#eadcf4;stroke:#9270a7;stroke-width:2.5}
      .dwpw{fill:#fde0d1;stroke:#d7845f;stroke-width:2.3}.mbd{fill:#fff0ad;stroke:#c79a24;stroke-width:2.5}.lrc{fill:#d9efd8;stroke:#57985b;stroke-width:2.5}
      .flow{fill:none;stroke:#30343b;stroke-width:3.2;marker-end:url(#arrow)}.skip{fill:none;stroke:#457ba8;stroke-width:2.8;stroke-dasharray:12 9;marker-end:url(#arrow)}
      .residual{fill:none;stroke:#6b6f76;stroke-width:2.8;stroke-dasharray:4 8;marker-end:url(#arrow)}.guide{fill:none;stroke:#aeb5bd;stroke-width:1.6;stroke-dasharray:5 8}
    </style>
    <symbol id="dwpw" viewBox="0 0 86 62">
      <polygon points="8,7 78,7 70,55 0,55" class="dwpw"/>
      <path d="M13 18 H65 M10 31 H62 M7 44 H59" stroke="#cb7654" stroke-width="2" opacity="0.7"/>
    </symbol>
    <symbol id="mbd" viewBox="0 0 96 70">
      <polygon points="9,7 88,7 79,63 0,63" class="mbd"/>
      <path d="M16 21 H70 M11 35 H68 M7 49 H61" stroke="#b88c1f" stroke-width="2.2"/>
      <path d="M24 16 V55 M52 13 V52" stroke="#d4ab35" stroke-width="2" opacity="0.8"/>
    </symbol>
    <symbol id="lrc" viewBox="0 0 96 70">
      <polygon points="9,7 88,7 79,63 0,63" class="lrc"/>
      <circle cx="25" cy="25" r="5" fill="#5d9e62"/><circle cx="48" cy="25" r="5" fill="#5d9e62"/><circle cx="68" cy="25" r="5" fill="#5d9e62"/>
      <circle cx="18" cy="47" r="4" fill="#88bb8b"/><circle cx="48" cy="47" r="4" fill="#88bb8b"/><circle cx="73" cy="47" r="4" fill="#88bb8b"/>
    </symbol>
  </defs>

  <rect width="5300" height="2300" fill="#ffffff"/>
  <text x="2650" y="75" text-anchor="middle" class="txt title">MBDNet-P+ Architecture</text>
  <text x="2650" y="118" text-anchor="middle" class="txt subtitle">Three-scale encoder–decoder with locally routed motion-biased restoration</text>
  <text x="110" y="168" class="txt small">RGB-only inference · replicate padding to multiples of 4 · output cropped to the original size</text>

  <!-- Resolution lanes -->
  <rect x="55" y="205" width="5190" height="270" rx="22" class="lane"/>
  <rect x="55" y="580" width="5190" height="300" rx="22" class="lane"/>
  <rect x="55" y="1040" width="3090" height="380" rx="22" class="lane"/>
  <text x="80" y="240" class="txt stage">H × W</text>
  <text x="80" y="615" class="txt stage">H/2 × W/2</text>
  <text x="80" y="1075" class="txt stage">H/4 × W/4</text>

  <!-- Background flow paths first -->
  <path d="M205 340 H300" class="flow"/>
  <path d="M505 340 H620" class="flow"/>
  <path d="M1225 340 H1300 V725 H1345" class="flow"/>
  <path d="M1535 725 H1620" class="flow"/>
  <path d="M2405 725 H2470 V965" class="flow"/>
  <path d="M2565 1115 V1255 H690" class="flow"/>
  <path d="M2820 1255 H2890 V995" class="flow"/>
  <path d="M3080 995 H3115 V725 H3155" class="flow"/>
  <path d="M3215 725 H3280" class="flow"/>
  <path d="M4020 725 H4060 V535" class="flow"/>
  <path d="M4250 535 H4290 V340 H4325" class="flow"/>
  <path d="M4385 340 H4450" class="flow"/>
  <path d="M4850 340 H4910" class="flow"/>
  <path d="M5080 340 H5140" class="flow"/>
  <path d="M1168 296 V185 H3185 V695" class="skip"/>
  <path d="M2345 675 V530 H4355 V310" class="skip"/>
  <path d="M130 415 V2140 H4995 V380" class="residual"/>

  <!-- Input image -->
  <g filter="url(#shadow)">
    <polygon points="78,276 150,258 150,413 78,431" fill="#f5e7f0" stroke="#9a6d8d" stroke-width="2.5"/>
    <polygon points="92,261 164,243 164,398 92,416" fill="#faeef6" stroke="#9a6d8d" stroke-width="2.5"/>
    <polygon points="106,246 178,228 178,383 106,401" fill="#fff8fc" stroke="#9a6d8d" stroke-width="2.5"/>
  </g>
  <text x="128" y="451" text-anchor="middle" class="txt label">Blurred RGB</text>
  <text x="128" y="478" text-anchor="middle" class="txt small">B×3×H×W</text>

  <!-- Stem -->
  <rect x="300" y="272" width="205" height="136" rx="13" class="conv" filter="url(#shadow)"/>
  <text x="402" y="316" text-anchor="middle" class="txt stage">Stem</text>
  <text x="402" y="354" text-anchor="middle" class="txt label">3×3 Conv</text>
  <text x="402" y="386" text-anchor="middle" class="txt small">3 → 64</text>

  <!-- Encoder E0 -->
  <rect x="620" y="242" width="605" height="196" rx="18" class="group enc0"/>
  <text x="650" y="280" class="txt stage">Encoder E0</text>
  <text x="1195" y="280" text-anchor="end" class="txt small">B×64×H×W</text>
  <use href="#dwpw" x="710" y="310" width="110" height="80" filter="url(#shadow)"/>
  <use href="#dwpw" x="875" y="310" width="110" height="80" filter="url(#shadow)"/>
  <use href="#dwpw" x="1040" y="310" width="110" height="80" filter="url(#shadow)"/>
  <path d="M820 350 H875 M985 350 H1040" class="flow"/>
  <circle cx="1168" cy="350" r="8" fill="#30343b"/>
  <text x="1168" y="420" text-anchor="middle" class="txt small">F₀</text>

  <!-- Down-1 -->
  <rect x="1345" y="648" width="190" height="154" rx="14" class="down" filter="url(#shadow)"/>
  <text x="1440" y="690" text-anchor="middle" class="txt stage">Down-1</text>
  <text x="1440" y="726" text-anchor="middle" class="txt small">3×3 DW, s=2</text>
  <text x="1440" y="755" text-anchor="middle" class="txt small">1×1 PW</text>
  <text x="1440" y="785" text-anchor="middle" class="txt small">64 → 128</text>

  <!-- Encoder E1 -->
  <rect x="1620" y="620" width="785" height="210" rx="18" class="group enc1"/>
  <text x="1650" y="660" class="txt stage">Encoder E1</text>
  <text x="2375" y="660" text-anchor="end" class="txt small">B×128×H/2×W/2</text>
  <use href="#dwpw" x="1675" y="690" width="90" height="65"/>
  <use href="#dwpw" x="1795" y="690" width="90" height="65"/>
  <use href="#dwpw" x="1915" y="690" width="90" height="65"/>
  <use href="#dwpw" x="2035" y="690" width="90" height="65"/>
  <use href="#mbd" x="2180" y="685" width="105" height="75"/>
  <path d="M1765 723 H1795 M1885 723 H1915 M2005 723 H2035 M2125 723 H2180" class="flow"/>
  <circle cx="2345" cy="725" r="8" fill="#30343b"/>
  <text x="2345" y="805" text-anchor="middle" class="txt small">F₁</text>

  <!-- Down-2 -->
  <rect x="2470" y="962" width="190" height="154" rx="14" class="down" filter="url(#shadow)"/>
  <text x="2565" y="1004" text-anchor="middle" class="txt stage">Down-2</text>
  <text x="2565" y="1040" text-anchor="middle" class="txt small">3×3 DW, s=2</text>
  <text x="2565" y="1069" text-anchor="middle" class="txt small">1×1 PW</text>
  <text x="2565" y="1099" text-anchor="middle" class="txt small">128 → 256</text>

  <!-- Quarter-resolution bottleneck -->
  <rect x="600" y="1138" width="2220" height="238" rx="20" class="group bottle"/>
  <text x="635" y="1178" class="txt stage">Quarter-resolution Bottleneck</text>
  <text x="2785" y="1178" text-anchor="end" class="txt small">B×256×H/4×W/4</text>
  <text x="1135" y="1215" text-anchor="middle" class="txt tiny">12 generic restoration blocks</text>
  <g>
    <use href="#dwpw" x="660" y="1230" width="76" height="55"/><use href="#dwpw" x="745" y="1230" width="76" height="55"/>
    <use href="#dwpw" x="830" y="1230" width="76" height="55"/><use href="#dwpw" x="915" y="1230" width="76" height="55"/>
    <use href="#dwpw" x="1000" y="1230" width="76" height="55"/><use href="#dwpw" x="1085" y="1230" width="76" height="55"/>
    <use href="#dwpw" x="1170" y="1230" width="76" height="55"/><use href="#dwpw" x="1255" y="1230" width="76" height="55"/>
    <use href="#dwpw" x="1340" y="1230" width="76" height="55"/><use href="#dwpw" x="1425" y="1230" width="76" height="55"/>
    <use href="#dwpw" x="1510" y="1230" width="76" height="55"/><use href="#dwpw" x="1595" y="1230" width="76" height="55"/>
  </g>
  <path d="M736 1257 H745 M821 1257 H830 M906 1257 H915 M991 1257 H1000 M1076 1257 H1085 M1161 1257 H1170 M1246 1257 H1255 M1331 1257 H1340 M1416 1257 H1425 M1501 1257 H1510 M1586 1257 H1595" class="flow"/>
  <use href="#lrc" x="1740" y="1222" width="100" height="72"/>
  <use href="#mbd" x="1910" y="1222" width="100" height="72"/>
  <use href="#dwpw" x="2080" y="1230" width="76" height="55"/>
  <use href="#dwpw" x="2185" y="1230" width="76" height="55"/>
  <use href="#mbd" x="2360" y="1222" width="100" height="72"/>
  <text x="1790" y="1324" text-anchor="middle" class="txt tiny">LRC</text>
  <text x="1960" y="1324" text-anchor="middle" class="txt tiny">MBD-1</text>
  <text x="2170" y="1324" text-anchor="middle" class="txt tiny">Refine</text>
  <text x="2410" y="1324" text-anchor="middle" class="txt tiny">MBD-2</text>
  <path d="M1671 1257 H1740 M1840 1257 H1910 M2010 1257 H2080 M2156 1257 H2185 M2261 1257 H2360 M2460 1257 H2760" class="flow"/>

  <!-- Up-1 and half-resolution decoder -->
  <rect x="2890" y="918" width="190" height="154" rx="14" class="up" filter="url(#shadow)"/>
  <text x="2985" y="960" text-anchor="middle" class="txt stage">Up-1</text>
  <text x="2985" y="996" text-anchor="middle" class="txt small">1×1: 256→512</text>
  <text x="2985" y="1025" text-anchor="middle" class="txt small">PixelShuffle(2)</text>
  <text x="2985" y="1055" text-anchor="middle" class="txt small">→128 channels</text>
  <circle cx="3185" cy="725" r="30" fill="#fff" stroke="#333" stroke-width="2.8"/>
  <text x="3185" y="737" text-anchor="middle" class="txt stage">+</text>
  <rect x="3280" y="620" width="740" height="210" rx="18" class="group decoder"/>
  <text x="3310" y="660" class="txt stage">Decoder D1</text>
  <text x="3990" y="660" text-anchor="end" class="txt small">B×128×H/2×W/2</text>
  <use href="#dwpw" x="3330" y="690" width="90" height="65"/>
  <use href="#dwpw" x="3450" y="690" width="90" height="65"/>
  <use href="#dwpw" x="3570" y="690" width="90" height="65"/>
  <use href="#dwpw" x="3690" y="690" width="90" height="65"/>
  <use href="#mbd" x="3835" y="685" width="105" height="75"/>
  <path d="M3420 723 H3450 M3540 723 H3570 M3660 723 H3690 M3780 723 H3835" class="flow"/>

  <!-- Up-2 and full-resolution decoder -->
  <rect x="4060" y="458" width="190" height="154" rx="14" class="up" filter="url(#shadow)"/>
  <text x="4155" y="500" text-anchor="middle" class="txt stage">Up-2</text>
  <text x="4155" y="536" text-anchor="middle" class="txt small">1×1: 128→256</text>
  <text x="4155" y="565" text-anchor="middle" class="txt small">PixelShuffle(2)</text>
  <text x="4155" y="595" text-anchor="middle" class="txt small">→64 channels</text>
  <circle cx="4355" cy="340" r="30" fill="#fff" stroke="#333" stroke-width="2.8"/>
  <text x="4355" y="352" text-anchor="middle" class="txt stage">+</text>
  <rect x="4450" y="242" width="400" height="196" rx="18" class="group decoder"/>
  <text x="4480" y="280" class="txt stage">Decoder D0</text>
  <text x="4820" y="280" text-anchor="end" class="txt small">B×64×H×W</text>
  <use href="#dwpw" x="4495" y="310" width="90" height="65"/>
  <use href="#dwpw" x="4605" y="310" width="90" height="65"/>
  <use href="#dwpw" x="4715" y="310" width="90" height="65"/>
  <path d="M4585 343 H4605 M4695 343 H4715" class="flow"/>

  <!-- Head, residual addition and output -->
  <rect x="4910" y="280" width="170" height="120" rx="13" class="conv" filter="url(#shadow)"/>
  <text x="4995" y="320" text-anchor="middle" class="txt stage">Head</text>
  <text x="4995" y="354" text-anchor="middle" class="txt label">3×3 Conv</text>
  <text x="4995" y="383" text-anchor="middle" class="txt small">64 → 3</text>
  <circle cx="5170" cy="340" r="30" fill="#fff" stroke="#333" stroke-width="2.8"/>
  <text x="5170" y="352" text-anchor="middle" class="txt stage">+</text>
  <g transform="translate(5192,252)" filter="url(#shadow)">
    <polygon points="0,25 58,10 58,140 0,155" fill="#e7f2ff" stroke="#608cb5" stroke-width="2.5"/>
    <polygon points="14,10 72,-5 72,125 14,140" fill="#f4f9ff" stroke="#608cb5" stroke-width="2.5"/>
  </g>
  <text x="5233" y="445" text-anchor="middle" class="txt label">Restored RGB</text>
  <text x="5233" y="472" text-anchor="middle" class="txt small">B×3×H×W</text>

  <!-- Skip labels -->
  <text x="2165" y="174" text-anchor="middle" class="txt small" fill="#457ba8">Skip F₀ · element-wise addition after Up-2</text>
  <text x="3345" y="516" text-anchor="middle" class="txt small" fill="#457ba8">Skip F₁ · element-wise addition after Up-1</text>

  <!-- Bottom-left equation and compact architecture statement -->
  <rect x="100" y="1540" width="2740" height="480" rx="22" fill="#f8fafc" stroke="#8091a3" stroke-width="2.3"/>
  <text x="145" y="1595" class="txt stage">Data flow and deployment facts</text>
  <text x="145" y="1650" class="txt label">Downsample: 3×3 depthwise convolution (stride 2) followed by 1×1 pointwise projection.</text>
  <text x="145" y="1702" class="txt label">Upsample: 1×1 channel expansion followed by PixelShuffle(2); skip fusion uses element-wise addition.</text>
  <text x="145" y="1754" class="txt label">Motion-biased processing is restricted to H/2 and H/4; the full-resolution path remains generic.</text>
  <text x="145" y="1806" class="txt label">Output residual:</text>
  <text x="405" y="1806" class="txt stage">Î = I<tspan baseline-shift="sub" font-size="19">B</tspan> + R</text>
  <text x="145" y="1868" class="txt label">Topology: 64 → 128 → 256 channels · 28 DWPW · 4 MBD · 1 LRC · 13.70 M parameters</text>
  <text x="145" y="1930" class="txt small">No seam mask, material label, domain label or stored degradation parameter is used at inference.</text>

  <!-- Bottom-right legend -->
  <rect x="3080" y="1500" width="2070" height="610" rx="22" fill="#fff" stroke="#545c66" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="3125" y="1560" class="txt stage">Legend</text>
  <use href="#dwpw" x="3150" y="1600" width="105" height="76"/>
  <text x="3300" y="1648" class="txt label">DWPW generic restoration block</text>
  <use href="#mbd" x="3150" y="1705" width="105" height="76"/>
  <text x="3300" y="1753" class="txt label">MBD local motion-biased block</text>
  <use href="#lrc" x="3150" y="1810" width="105" height="76"/>
  <text x="3300" y="1858" class="txt label">LRC low-resolution context</text>
  <rect x="3980" y="1608" width="105" height="62" rx="10" class="down"/>
  <text x="4130" y="1648" class="txt label">Downsample</text>
  <rect x="3980" y="1713" width="105" height="62" rx="10" class="up"/>
  <text x="4130" y="1753" class="txt label">PixelShuffle upsample</text>
  <circle cx="4033" cy="1845" r="29" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="4033" y="1856" text-anchor="middle" class="txt stage">+</text>
  <text x="4130" y="1853" class="txt label">Element-wise addition</text>
  <path d="M3980 1955 H4090" class="skip"/>
  <text x="4130" y="1963" class="txt label">Cross-scale skip connection</text>
  <path d="M3150 1980 H3260" class="residual"/>
  <text x="3300" y="1988" class="txt label">Global image residual</text>

  <text x="2650" y="2225" text-anchor="middle" class="txt small">All colored glyphs inside a stage correspond to individual modules; repeated blocks are shown explicitly rather than written as “n×”.</text>
</svg>
