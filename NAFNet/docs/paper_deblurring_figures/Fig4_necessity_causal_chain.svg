<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
  <defs><marker id="a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#222"/></marker><style>.t{font-family:'Times New Roman','SimSun',serif;fill:#111}.h{font-size:29px;font-weight:bold}.m{font-size:23px}.s{font-size:19px}.b{fill:#fff;stroke:#222;stroke-width:2}.g{fill:#e8e8e8;stroke:#222;stroke-width:2}.d{fill:#bfbfbf;stroke:#111;stroke-width:2.5}.l{fill:none;stroke:#222;stroke-width:3;marker-end:url(#a)}.thin{fill:none;stroke:#555;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="850" fill="white"/><text x="750" y="46" text-anchor="middle" class="t h">去模糊模块存在必要性的三层因果证据</text><text x="750" y="78" text-anchor="middle" class="t s">同一批 48 张清晰源图及其一一对应合成运动模糊样本；所有下游模型与阈值保持冻结</text>
  <rect x="55" y="135" width="380" height="180" rx="6" class="b"/><text x="245" y="180" text-anchor="middle" class="t h">清晰参考</text><text x="245" y="225" text-anchor="middle" class="t m">分割 F1：89.12%</text><text x="245" y="260" text-anchor="middle" class="t m">分割 IoU：80.45%</text><text x="245" y="295" text-anchor="middle" class="t m">缺陷宏 F1：82.89%</text>
  <rect x="560" y="135" width="380" height="180" rx="6" class="g"/><text x="750" y="180" text-anchor="middle" class="t h">直接模糊</text><text x="750" y="225" text-anchor="middle" class="t m">分割 F1：82.54%（−6.58）</text><text x="750" y="260" text-anchor="middle" class="t m">分割 IoU：70.76%（−9.69）</text><text x="750" y="295" text-anchor="middle" class="t m">缺陷宏 F1：52.66%（−30.23）</text>
  <rect x="1065" y="135" width="380" height="180" rx="6" class="d"/><text x="1255" y="180" text-anchor="middle" class="t h">MBDNet-P+ 去模糊</text><text x="1255" y="225" text-anchor="middle" class="t m">PSNR：28.65 dB</text><text x="1255" y="260" text-anchor="middle" class="t m">SSIM：0.8856</text><text x="1255" y="295" text-anchor="middle" class="t m">MAE：0.0262</text>
  <path d="M435 225 H560" class="l"/><text x="498" y="208" text-anchor="middle" class="t s">施加退化</text><path d="M940 225 H1065" class="l"/><text x="1002" y="208" text-anchor="middle" class="t s">冻结恢复</text>
  <rect x="280" y="430" width="420" height="235" rx="6" class="g"/><text x="490" y="475" text-anchor="middle" class="t h">分割层恢复</text><text x="490" y="525" text-anchor="middle" class="t m">F1：82.54% → 88.12%</text><text x="490" y="565" text-anchor="middle" class="t m">IoU：70.76% → 78.89%</text><text x="490" y="605" text-anchor="middle" class="t m">轨迹 F1：91.51% → 97.34%</text><text x="490" y="645" text-anchor="middle" class="t s">清晰—模糊损失恢复率：84.7% / 83.9% / 89.2%</text>
  <rect x="800" y="430" width="420" height="235" rx="6" class="d"/><text x="1010" y="475" text-anchor="middle" class="t h">缺陷检测层恢复</text><text x="1010" y="525" text-anchor="middle" class="t m">宏 F1：52.66% → 71.01%</text><text x="1010" y="565" text-anchor="middle" class="t m">局部完全正确率：77.43% → 93.06%</text><text x="1010" y="605" text-anchor="middle" class="t m">图像级完全正确率：35.42% → 58.33%</text><text x="1010" y="645" text-anchor="middle" class="t s">清晰—模糊损失恢复率：60.7% / 81.8% / 57.9%</text>
  <path d="M1255 315 V375 H490 V430" class="thin"/><path d="M1255 315 V375 H1010 V430" class="thin"/>
  <rect x="245" y="735" width="1010" height="70" rx="5" class="b"/><text x="750" y="765" text-anchor="middle" class="t m">因果结论：运动模糊破坏线迹边界与缺陷判别线索；恢复模块在不更改分割器、检测器及阈值的条件下，</text><text x="750" y="795" text-anchor="middle" class="t m">使两级下游任务均明显回升，因此去模糊并非仅改善视觉观感，而是端到端检测链中的必要环节。</text>
</svg>
