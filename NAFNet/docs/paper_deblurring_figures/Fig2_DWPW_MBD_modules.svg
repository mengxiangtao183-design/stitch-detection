<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#222"/></marker><style>.t{font-family:'Times New Roman','SimSun',serif;fill:#111}.h{font-size:29px;font-weight:bold}.m{font-size:22px}.s{font-size:18px}.b{fill:#fff;stroke:#222;stroke-width:2}.g{fill:#e8e8e8;stroke:#222;stroke-width:2}.d{fill:#c9c9c9;stroke:#111;stroke-width:2.5}.l{fill:none;stroke:#222;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs>
