# ==================== FSPNet 配置文件（完整版）====================
model:
  name: "FSPNet"
  image_processing:
    target_size: 320
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
  ckpt: null                     # DeiT 预训练权重路径，暂不使用则保持 null

# ====================== Training 配置 ======================
training:
  num_epochs: 200
  batch_size: 4
  use_amp: true
  num_workers: 0
  val_ratio: 0.1
  save_freq: 20
  gradient_clip: 1.0
  early_stop_patience: 50
  min_delta: 0.0005

  # Optimizer 配置（trainer.py 会读取这里）
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.01
    encoder_lr_ratio: 0.2

  # Scheduler 配置
  scheduler:
    type: cosine_annealing
    eta_min: 1e-6

  # Loss 配置（保持与 C3Net 一致）
  loss:
    w_edge: 1.0
    w_loc: 1.15
    w_final: 1.2
    focal_alpha: 0.25
    focal_gamma: 3.0
    tversky_alpha_loc: 0.6
    tversky_beta_loc: 0.4
    tversky_alpha_final: 0.4
    tversky_beta_final: 0.6
    final_edge_dice_weight: 0.2
    edge_focal_weight: 5.0
    edge_reg_weight: 0.15
    edge_dist_cutoff: 5
    instance_weight_k: 3.0
    instance_weight_low_thresh: 0.02
    instance_weight_high_thresh: 0.8
    eps: 0.0000001

  # 数据集路径
  datasets:
    - "datasets/img3"

# ====================== Evaluation 配置 ======================
evaluation:
  batch_size: 2
  num_workers: 8
  datasets:
    - "datasets/img3"

# ====================== Prediction 配置 ======================
prediction:
  batch_size: 1
  output_size: null
