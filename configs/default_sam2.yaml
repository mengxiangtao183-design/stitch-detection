# Configuration for SAM2 (Contrastive Experiment)

model:
  name: "SAM2" 

  image_processing:
    target_size: 320
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]

# --- Training Configuration ---
training:
  num_epochs: 200
  batch_size: 4 # 如果显存溢出 (OOM)，请降为 2
  use_amp: true
  num_workers: 4
  val_ratio: 0.1
  save_freq: 20
  gradient_clip: 1.0
  early_stop_patience: 50
  min_delta: 0.0005

  optimizer:
    learning_rate: 0.00005 # SAM2 是基于海量数据预训练的，微调学习率要比 C3Net 小
    weight_decay: 0.01
    encoder_lr_ratio: 0.1

  scheduler:
    type: cosine_annealing
    T_max: 200
    eta_min: 1e-6

  loss:
    w_edge: 1.0   
    w_loc: 1.15   
    w_final: 1.2  
    focal_alpha: 0.25
    focal_gamma: 3.0
    tversky_alpha_loc: 0.6
    tversky_beta_loc: 0.4
    tversky_alpha_final: 0.4
    tversky_beta_final: 0.6
    final_edge_dice_weight: 0.2
    edge_focal_weight: 5.0
    edge_reg_weight: 0.15
    edge_dist_cutoff: 5
    instance_weight_k: 3.0
    instance_weight_low_thresh: 0.02
    instance_weight_high_thresh: 0.8
    eps: 0.0000001

  datasets:
    - "datasets/img3"

evaluation:
  batch_size: 2
  num_workers: 4
  datasets:
    - "datasets/img3"

prediction:
  batch_size: 1
  output_size: null
