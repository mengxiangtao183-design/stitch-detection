# Original DINOv2-L C3Net reference run for module-ablation context.
# Dataset files are never modified: images are resized in memory to 308 x 308.

model:
  name: "C3Net-DINOv2L-original-clear100-308"
  image_processing:
    target_size: 308
    image_subdir: "clear"
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]

  encoder:
    model_name: "facebook/dinov2-with-registers-large"
    variant: "large"
    output_stages: [1, 2, 23, 24]
    patch_size: 14

  decoder:
    upsampler:
      style: "lp"
      groups: 4
      dyscope: false
    edge_branch:
      intermediate_channels: [512, 256, 128]
      output_channels: 128
      num_enhance_blocks: 2
    loc_branch:
      intermediate_channels: [512, 256, 128]
      output_channels: 128
      num_enhance_blocks: 1
      icg_params:
        image_channels: 3
        ia_cnn_channels: 32
        contrast_channels: 16
        contrast_agg_kernel: 5
        contrast_bg_thresh: 0.1

  fusion_head:
    fuse_channels: 128
    num_refine_blocks: 2
    attn_gen_intermediate_channels: 64

training:
  seed: 42
  num_epochs: 30
  # DINOv2-L is substantially larger than the MobileNet model. Raise only if GPU memory allows.
  batch_size: 2
  use_amp: true
  num_workers: 0
  val_ratio: 0.1
  max_samples_per_dataset: 100
  save_freq: 30
  gradient_clip: 1.0
  # All runs must receive the same 30-epoch budget.
  early_stop_patience: 31
  min_delta: 0.0005
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.01
    encoder_lr_ratio: 0.2
  scheduler:
    factor: 0.5
    patience: 10
    min_lr: 0.000001
  loss:
    w_edge: 1.0
    w_loc: 1.15
    w_final: 1.2
    focal_alpha: 0.25
    focal_gamma: 3.0
    tversky_alpha_loc: 0.6
    tversky_beta_loc: 0.4
    tversky_alpha_final: 0.4
    tversky_beta_final: 0.6
    final_edge_dice_weight: 0.2
    edge_focal_weight: 5.0
    edge_reg_weight: 0.15
    edge_dist_cutoff: 5
    instance_weight_k: 3.0
    instance_weight_low_thresh: 0.02
    instance_weight_high_thresh: 0.8
    eps: 0.0000001
  datasets:
    - "H:/DATASET/DB"
    - "H:/DATASET/XJ"
    - "H:/DATASET/SD"

evaluation:
  batch_size: 2
  num_workers: 0
  datasets:
    - "H:/DATASET/DB"
    - "H:/DATASET/XJ"
    - "H:/DATASET/SD"
    - "H:/DATASET/RX"

prediction:
  batch_size: 1
  output_size: null
