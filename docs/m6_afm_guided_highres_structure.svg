<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .title{font:700 28px Arial, sans-serif;fill:#111827}
      .subtitle{font:500 16px Arial, sans-serif;fill:#374151}
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:12;ry:12}
      .blue{fill:#eff6ff;stroke:#2563eb}
      .green{fill:#ecfdf5;stroke:#059669}
      .orange{fill:#fff7ed;stroke:#ea580c}
      .purple{fill:#f5f3ff;stroke:#7c3aed}
      .red{fill:#fef2f2;stroke:#dc2626}
      .gray{fill:#f9fafb;stroke:#6b7280}
      .txt{font:600 15px Arial, sans-serif;fill:#111827}
      .small{font:400 12px Arial, sans-serif;fill:#374151}
      .tiny{font:400 11px Arial, sans-serif;fill:#4b5563}
      .arrow{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#6b7280;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowGray)}
      .label{font:600 12px Arial, sans-serif;fill:#111827}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111827"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="750" y="40" text-anchor="middle" class="title">M6 AFM-guided HighRes C3Net Structure</text>
  <text x="750" y="66" text-anchor="middle" class="subtitle">Current best model: MobileNetV4 + Mobile-FPN + AFM-guided HighRes refinement</text>

  <!-- Input -->
  <rect x="55" y="115" width="170" height="68" class="box gray"/>
  <text x="140" y="143" text-anchor="middle" class="txt">Input RGB</text>
  <text x="140" y="166" text-anchor="middle" class="small">3 × 320 × 320</text>

  <!-- Backbone -->
  <rect x="300" y="95" width="265" height="110" class="box blue"/>
  <text x="432" y="126" text-anchor="middle" class="txt">Backbone</text>
  <text x="432" y="150" text-anchor="middle" class="small">MobileNetV4 Hybrid Medium</text>
  <text x="432" y="172" text-anchor="middle" class="tiny">local pretrained weights</text>
  <text x="432" y="190" text-anchor="middle" class="tiny">CoordAtt disabled in M0/M4/M6 full line</text>

  <path d="M225 149 L300 149" class="arrow"/>

  <!-- C stages -->
  <rect x="640" y="80" width="165" height="52" class="box blue"/>
  <text x="722" y="102" text-anchor="middle" class="txt">C2</text>
  <text x="722" y="121" text-anchor="middle" class="small">48 × 80 × 80</text>
  <rect x="640" y="145" width="165" height="52" class="box blue"/>
  <text x="722" y="167" text-anchor="middle" class="txt">C3</text>
  <text x="722" y="186" text-anchor="middle" class="small">80 × 40 × 40</text>
  <rect x="640" y="210" width="165" height="52" class="box blue"/>
  <text x="722" y="232" text-anchor="middle" class="txt">C4</text>
  <text x="722" y="251" text-anchor="middle" class="small">160 × 20 × 20</text>
  <rect x="640" y="275" width="165" height="52" class="box blue"/>
  <text x="722" y="297" text-anchor="middle" class="txt">C5</text>
  <text x="722" y="316" text-anchor="middle" class="small">960 × 10 × 10</text>

  <path d="M565 130 L640 106" class="arrow"/>
  <path d="M565 145 L640 171" class="arrow"/>
  <path d="M565 160 L640 236" class="arrow"/>
  <path d="M565 175 L640 301" class="arrow"/>

  <!-- Lateral -->
  <rect x="880" y="80" width="190" height="247" class="box green"/>
  <text x="975" y="108" text-anchor="middle" class="txt">1×1 Lateral Projection</text>
  <text x="975" y="132" text-anchor="middle" class="small">all stages → 192 channels</text>
  <text x="975" y="166" text-anchor="middle" class="small">L2: 192 × 80 × 80</text>
  <text x="975" y="193" text-anchor="middle" class="small">L3: 192 × 40 × 40</text>
  <text x="975" y="220" text-anchor="middle" class="small">L4: 192 × 20 × 20</text>
  <text x="975" y="247" text-anchor="middle" class="small">L5: 192 × 10 × 10</text>
  <text x="975" y="286" text-anchor="middle" class="tiny">Conv + GroupNorm + ReLU</text>

  <path d="M805 106 L880 106" class="arrow"/>
  <path d="M805 171 L880 171" class="arrow"/>
  <path d="M805 236 L880 236" class="arrow"/>
  <path d="M805 301 L880 301" class="arrow"/>

  <!-- FPN -->
  <rect x="1145" y="75" width="280" height="270" class="box green"/>
  <text x="1285" y="105" text-anchor="middle" class="txt">Mobile-FPN Top-down Path</text>
  <text x="1285" y="132" text-anchor="middle" class="small">bilinear upsample + additive fusion</text>
  <text x="1285" y="164" text-anchor="middle" class="small">P5 = DSRefine(L5)</text>
  <text x="1285" y="192" text-anchor="middle" class="small">P4 = DSRefine(L4 + up(P5))</text>
  <text x="1285" y="220" text-anchor="middle" class="small">P3 = DSRefine(L3 + up(P4))</text>
  <text x="1285" y="248" text-anchor="middle" class="small">P2 = DSRefine(L2 + up(P3))</text>
  <text x="1285" y="292" text-anchor="middle" class="tiny">No D1 deform-align, no DySample, no extra modules</text>
  <text x="1285" y="312" text-anchor="middle" class="tiny">P2: 80×80, P3: 40×40, P4: 20×20, P5: 10×10</text>

  <path d="M1070 203 L1145 203" class="arrow"/>

  <!-- Edge branch -->
  <rect x="120" y="440" width="290" height="135" class="box orange"/>
  <text x="265" y="470" text-anchor="middle" class="txt">Edge / Detail Branch</text>
  <text x="265" y="498" text-anchor="middle" class="small">concat(P2, up(P3))</text>
  <text x="265" y="523" text-anchor="middle" class="small">384 × 80 × 80</text>
  <text x="265" y="548" text-anchor="middle" class="small">ConvGNReLU + EdgeEnhanceBlock</text>
  <text x="265" y="568" text-anchor="middle" class="tiny">edge_features: 128 × 80 × 80</text>

  <!-- Loc branch -->
  <rect x="480" y="440" width="315" height="135" class="box purple"/>
  <text x="637" y="470" text-anchor="middle" class="txt">Localization / Context Branch</text>
  <text x="637" y="498" text-anchor="middle" class="small">P4 context refine + ICG</text>
  <text x="637" y="523" text-anchor="middle" class="small">RGB-guided context suppression</text>
  <text x="637" y="548" text-anchor="middle" class="small">up to P2 + loc_refine</text>
  <text x="637" y="568" text-anchor="middle" class="tiny">loc_features: 128 × 80 × 80</text>

  <path d="M1230 345 C1080 395, 620 385, 315 440" class="arrow"/>
  <path d="M1310 345 C1165 405, 885 400, 675 440" class="arrow"/>
  <path d="M140 183 C95 270, 95 370, 150 440" class="dash"/>
  <text x="110" y="330" class="tiny">RGB for ICG</text>

  <!-- AFM -->
  <rect x="880" y="440" width="265" height="135" class="box red"/>
  <text x="1012" y="470" text-anchor="middle" class="txt">AFM / FinalFusionHead</text>
  <text x="1012" y="498" text-anchor="middle" class="small">attentive fusion of edge + loc</text>
  <text x="1012" y="523" text-anchor="middle" class="small">coarse final logits</text>
  <text x="1012" y="548" text-anchor="middle" class="small">AFM probability + uncertainty</text>
  <text x="1012" y="568" text-anchor="middle" class="tiny">used as HighRes prior in M6</text>

  <path d="M410 508 L880 508" class="arrow"/>
  <path d="M795 508 L880 508" class="arrow"/>

  <!-- HighRes -->
  <rect x="430" y="680" width="600" height="185" class="box red"/>
  <text x="730" y="712" text-anchor="middle" class="txt">AFM-guided HighResStitchRefineHead</text>
  <text x="730" y="742" text-anchor="middle" class="small">edge_features ↑320 + loc_features ↑320 + RGB detail</text>
  <text x="730" y="770" text-anchor="middle" class="small">+ AFM prob + AFM uncertainty</text>
  <text x="730" y="798" text-anchor="middle" class="small">concat → ConvGNReLU → DepthwiseSeparableRefine</text>
  <text x="730" y="826" text-anchor="middle" class="small">prediction heads: final / edge / centerline</text>
  <text x="730" y="850" text-anchor="middle" class="tiny">No WRD, no M7/M8/M10, no centerline/topology/boundary auxiliary loss</text>

  <path d="M265 575 C265 660, 430 735, 430 735" class="arrow"/>
  <path d="M637 575 C637 625, 645 655, 690 680" class="arrow"/>
  <path d="M1012 575 C1012 640, 925 655, 870 680" class="arrow"/>
  <path d="M140 183 C170 500, 250 650, 430 785" class="dash"/>
  <text x="250" y="653" class="tiny">RGB detail</text>

  <!-- Outputs -->
  <rect x="1120" y="690" width="255" height="155" class="box gray"/>
  <text x="1247" y="720" text-anchor="middle" class="txt">Outputs</text>
  <text x="1247" y="750" text-anchor="middle" class="small">final_mask: 1 × 320 × 320</text>
  <text x="1247" y="778" text-anchor="middle" class="small">edge_mask: 1 × 320 × 320</text>
  <text x="1247" y="806" text-anchor="middle" class="small">centerline_mask: 1 × 320 × 320</text>
  <text x="1247" y="832" text-anchor="middle" class="small">object_mask: 1 × 80 × 80</text>

  <path d="M1030 772 L1120 772" class="arrow"/>

  <!-- Metrics -->
  <rect x="95" y="890" width="1310" height="55" class="box gray"/>
  <text x="750" y="914" text-anchor="middle" class="txt">Full-150 macro performance</text>
  <text x="750" y="936" text-anchor="middle" class="small">Binary IoU 85.811 · Binary F1 92.327 · Trajectory F1@1px 99.232 · Boundary F1@1px 97.965 · Inference 16.47 ms/image</text>
</svg>
