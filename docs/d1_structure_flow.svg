<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220">
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Arial", sans-serif; fill: #111827; }
      .subtitle { font: 16px "Microsoft YaHei", "Arial", sans-serif; fill: #374151; }
      .label { font: 15px "Microsoft YaHei", "Arial", sans-serif; fill: #111827; }
      .small { font: 13px "Microsoft YaHei", "Arial", sans-serif; fill: #374151; }
      .tiny { font: 12px "Microsoft YaHei", "Arial", sans-serif; fill: #4b5563; }
      .box { stroke: #1f2937; stroke-width: 1.4; rx: 12; ry: 12; }
      .input { fill: #eff6ff; }
      .backbone { fill: #ecfdf5; }
      .fpn { fill: #fff7ed; }
      .d1 { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; }
      .branch { fill: #f5f3ff; }
      .head { fill: #fdf2f8; }
      .out { fill: #f0f9ff; }
      .disabled { fill: #f3f4f6; stroke: #9ca3af; stroke-dasharray: 6 5; }
      .line { stroke: #374151; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .redline { stroke: #dc2626; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #9ca3af; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1220" fill="#ffffff"/>
  <text x="60" y="58" class="title">D1：P3 跨尺度可变形对齐 + HighRes 细化的 C3Net 分割结构</text>
  <text x="60" y="88" class="subtitle">当前配置：configs/ablations/d1_p3_deformalign_highres.yaml；基础链路：M0 MobileNetV4-FPN → M4 HighRes → D1 P4→P3 DeformAlign</text>

  <!-- Input and backbone -->
  <rect class="box input" x="60" y="145" width="220" height="70"/>
  <text x="85" y="174" class="label">输入图像</text>
  <text x="85" y="198" class="small">RGB 3×320×320 / clear</text>

  <rect class="box backbone" x="360" y="110" width="245" height="80"/>
  <text x="386" y="142" class="label">MobileNetV4 Hybrid Medium</text>
  <text x="386" y="166" class="small">无 CoordAtt；加载 model.safetensors</text>

  <rect class="box backbone" x="690" y="95" width="210" height="58"/>
  <text x="712" y="121" class="label">C5：960×10×10</text>
  <text x="712" y="143" class="tiny">深层语义</text>
  <rect class="box backbone" x="690" y="180" width="210" height="58"/>
  <text x="712" y="206" class="label">C4：160×20×20</text>
  <text x="712" y="228" class="tiny">上下文/定位</text>
  <rect class="box backbone" x="690" y="265" width="210" height="58"/>
  <text x="712" y="291" class="label">C3：80×40×40</text>
  <text x="712" y="313" class="tiny">P3 对齐核心层</text>
  <rect class="box backbone" x="690" y="350" width="210" height="58"/>
  <text x="712" y="376" class="label">C2：48×80×80</text>
  <text x="712" y="398" class="tiny">浅层细节</text>

  <path class="line" d="M280 180 L360 150"/>
  <path class="thin" d="M605 150 L690 124"/>
  <path class="thin" d="M605 155 L690 209"/>
  <path class="thin" d="M605 160 L690 294"/>
  <path class="thin" d="M605 165 L690 379"/>

  <!-- Lateral projections -->
  <rect class="box fpn" x="980" y="95" width="210" height="58"/>
  <text x="1012" y="121" class="label">L5：1×1 Conv</text>
  <text x="1012" y="143" class="tiny">192×10×10</text>
  <rect class="box fpn" x="980" y="180" width="210" height="58"/>
  <text x="1012" y="206" class="label">L4：1×1 Conv</text>
  <text x="1012" y="228" class="tiny">192×20×20</text>
  <rect class="box fpn" x="980" y="265" width="210" height="58"/>
  <text x="1012" y="291" class="label">L3：1×1 Conv</text>
  <text x="1012" y="313" class="tiny">192×40×40</text>
  <rect class="box fpn" x="980" y="350" width="210" height="58"/>
  <text x="1012" y="376" class="label">L2：1×1 Conv</text>
  <text x="1012" y="398" class="tiny">192×80×80</text>

  <path class="thin" d="M900 124 L980 124"/>
  <path class="thin" d="M900 209 L980 209"/>
  <path class="thin" d="M900 294 L980 294"/>
  <path class="thin" d="M900 379 L980 379"/>

  <!-- FPN top-down -->
  <rect class="box fpn" x="1280" y="95" width="230" height="58"/>
  <text x="1308" y="121" class="label">P5 smooth</text>
  <text x="1308" y="143" class="tiny">DepthwiseSeparableRefine</text>
  <rect class="box fpn" x="1280" y="180" width="230" height="58"/>
  <text x="1308" y="206" class="label">P4 = smooth(L4 + ↑P5)</text>
  <text x="1308" y="228" class="tiny">192×20×20</text>
  <rect class="box d1" x="1245" y="258" width="300" height="82"/>
  <text x="1274" y="286" class="label">D1 新增：CrossScaleDeformAlign</text>
  <text x="1274" y="310" class="small">输入：L3 与 ↑P4；offset/gate 自适应采样</text>
  <text x="1274" y="332" class="tiny">gate_channels=48，max_offset=2.0</text>
  <rect class="box fpn" x="1280" y="362" width="230" height="58"/>
  <text x="1308" y="388" class="label">P3 smooth</text>
  <text x="1308" y="410" class="tiny">192×40×40</text>
  <rect class="box fpn" x="1280" y="447" width="230" height="58"/>
  <text x="1308" y="473" class="label">P2 = smooth(L2 + ↑P3)</text>
  <text x="1308" y="495" class="tiny">192×80×80</text>

  <path class="thin" d="M1190 124 L1280 124"/>
  <path class="thin" d="M1190 209 L1280 209"/>
  <path class="thin" d="M1190 294 L1245 299"/>
  <path class="thin" d="M1190 379 L1280 476"/>
  <path class="line" d="M1395 153 L1395 180"/>
  <path class="line" d="M1395 238 L1395 258"/>
  <path class="redline" d="M1395 340 L1395 362"/>
  <path class="line" d="M1395 420 L1395 447"/>

  <!-- Branches -->
  <rect class="box branch" x="145" y="610" width="310" height="90"/>
  <text x="178" y="640" class="label">Edge 分支</text>
  <text x="178" y="664" class="small">concat(P2, ↑P3) → ConvGNReLU</text>
  <text x="178" y="686" class="tiny">edge_channels=128；无 TCE/SGCL</text>

  <rect class="box branch" x="590" y="610" width="310" height="90"/>
  <text x="623" y="640" class="label">Context / Loc 分支</text>
  <text x="623" y="664" class="small">P4 → SemanticEnhance → ICG</text>
  <text x="623" y="686" class="tiny">↑到P3再↑到P2，与P2相加 → loc 128</text>

  <rect class="box head" x="1035" y="610" width="310" height="90"/>
  <text x="1068" y="640" class="label">FinalFusionHead</text>
  <text x="1068" y="664" class="small">Edge + Loc 注意力融合</text>
  <text x="1068" y="686" class="tiny">fusion_channels=128；非普通融合头</text>

  <rect class="box head" x="1035" y="755" width="310" height="105"/>
  <text x="1068" y="786" class="label">M4 HighResStitchRefineHead</text>
  <text x="1068" y="812" class="small">edge + loc + RGB → 320×320</text>
  <text x="1068" y="835" class="tiny">refine_channels=48，image_channels=16，num_blocks=1</text>

  <path class="line" d="M1395 505 C1395 560 300 540 300 610"/>
  <path class="line" d="M1395 420 C1395 565 745 545 745 610"/>
  <path class="line" d="M1395 505 C1395 560 745 545 745 610"/>
  <path class="line" d="M455 655 L1035 655"/>
  <path class="line" d="M900 655 L1035 655"/>
  <path class="line" d="M1190 700 L1190 755"/>
  <path class="thin" d="M300 700 C300 780 1035 790 1035 808"/>
  <path class="thin" d="M745 700 C745 780 1035 820 1035 825"/>
  <path class="thin" d="M170 215 C120 475 1035 765 1035 810"/>

  <!-- Outputs -->
  <rect class="box out" x="1405" y="735" width="220" height="58"/>
  <text x="1430" y="761" class="label">final_mask</text>
  <text x="1430" y="783" class="tiny">1×320×320，主分割输出</text>
  <rect class="box out" x="1405" y="815" width="220" height="58"/>
  <text x="1430" y="841" class="label">edge_mask</text>
  <text x="1430" y="863" class="tiny">1×320×320，训练辅助</text>
  <rect class="box out" x="1405" y="895" width="220" height="58"/>
  <text x="1430" y="921" class="label">centerline_mask</text>
  <text x="1430" y="943" class="tiny">1×320×320，权重为0</text>
  <rect class="box out" x="1405" y="975" width="220" height="58"/>
  <text x="1430" y="1001" class="label">object_mask</text>
  <text x="1430" y="1023" class="tiny">1×80×80，loc辅助</text>

  <path class="line" d="M1345 792 L1405 764"/>
  <path class="line" d="M1345 820 L1405 844"/>
  <path class="line" d="M1345 840 L1405 924"/>
  <path class="thin" d="M900 680 C1140 1010 1280 1010 1405 1004"/>

  <!-- Loss / metrics -->
  <rect class="box out" x="80" y="770" width="385" height="150"/>
  <text x="110" y="802" class="label">D1 训练损失启用项</text>
  <text x="110" y="830" class="small">w_final=1.2，w_loc=1.15，w_edge=1.0</text>
  <text x="110" y="855" class="small">final_edge_dice_weight=0.2</text>
  <text x="110" y="880" class="small">centerline/topology/boundary = 0</text>
  <text x="110" y="905" class="tiny">训练集：DB/XJ/SD，每数据集 clear100；评估：DB/XJ/SD/RX</text>

  <rect class="box disabled" x="520" y="775" width="375" height="145"/>
  <text x="550" y="807" class="label">D1 未启用模块</text>
  <text x="550" y="835" class="small">TCE / SGCL / DySample：关闭</text>
  <text x="550" y="860" class="small">P2 DeformAlign：关闭</text>
  <text x="550" y="885" class="small">SDF / topology / boundary loss：关闭</text>
  <text x="550" y="910" class="small">D11 P3 双流强化：另一个新实验，不属于 D1</text>

  <!-- Legend -->
  <rect class="box input" x="80" y="1035" width="160" height="42"/>
  <text x="102" y="1062" class="small">输入/图像</text>
  <rect class="box backbone" x="260" y="1035" width="160" height="42"/>
  <text x="282" y="1062" class="small">Backbone</text>
  <rect class="box fpn" x="440" y="1035" width="160" height="42"/>
  <text x="462" y="1062" class="small">FPN 基础路径</text>
  <rect class="box d1" x="620" y="1035" width="180" height="42"/>
  <text x="642" y="1062" class="small">D1 新增模块</text>
  <rect class="box head" x="820" y="1035" width="180" height="42"/>
  <text x="842" y="1062" class="small">融合/细化头</text>
  <rect class="box disabled" x="1020" y="1035" width="200" height="42"/>
  <text x="1042" y="1062" class="small">当前未启用</text>

  <text x="80" y="1135" class="tiny">注：D1 的创新位置是 P4_up 与 L3 融合处的跨尺度可变形对齐；M4 HighRes 是它继承的已验证有效结构。当前代码中新增的 D11 只在 d11 配置启用，D1 配置不会自动启用。</text>
</svg>
