GPU: [0]

VERBOSE: True

# F: TPT-Net + Adaptive Frequency BandGate.
# This is a single-module ablation: edge refinement remains disabled.
MODEL:
  MODE: 'Deblurring'
  SESSION: 'TPT_Net_BandGate_Fast100'
  N_FEAT: 96
  SCALE_UNETFEATS: 48
  SCALE_ORSNETFEATS: 32
  NUM_CAB: 8

  # Fixed TPT-Net structural baseline.
  EDGE_REFINE: False
  LIGHT_ADAPT: False
  TRAJECTORY_LIGHTWEIGHT: False
  STAGE1_TRISTRIPE: True
  STAGE1_STRIPES: 3
  STAGE1_OVERLAP: 0.20
  STAGE2_OVERLAP: 0.0
  STAGE2_PAIR_ALIGNED: True
  GATED_CSFF: True
  GATED_CSFF_HORIZONTAL_KERNEL: 7

  # Proposed frequency-detail innovation.
  FREQUENCY_REFINE: True
  FREQUENCY_REFINE_HIDDEN: 16
  FREQUENCY_BAND_GATE: True
  FREQUENCY_BAND_LOW_START: 0.05
  FREQUENCY_BAND_LOW_END: 0.10
  FREQUENCY_BAND_HIGH_START: 0.30
  FREQUENCY_BAND_HIGH_END: 0.40
  FREQUENCY_DISAGREEMENT_GATE: False

OPTIM:
  BATCH_SIZE: 2
  NUM_EPOCHS: 25
  LR_INITIAL: 1.0e-5
  LR_MIN: 1.0e-6
  ACCUM_ITERS: 4
  # Fresh frequency parameters adapt faster while the inherited TPT-Net is preserved.
  FREQUENCY_LR_MULTIPLIER: 10.0

TRAINING:
  VAL_AFTER_EVERY: 3
  CHECKPOINT_EVERY: 5
  DO_VALIDATE: True
  RESUME: true
  FINETUNE: true
  PRETRAINED_PATH: 'H:/C3Netqing/Deblurring/checkpoints/train/Deblurring/models/MPRNet_TriStripe_PairAligned_GatedCSFF_Fast100_FT/model_best.pth'
  TRAIN_PS: 320
  VAL_PS: 320
  TRAIN_DIR: ''
  VAL_DIR: ''
  TRAIN_DIRS:
    - 'H:/DATASET/DB/train'
    - 'H:/DATASET/XJ/train'
    - 'H:/DATASET/SD/train'
  VAL_DIRS: []
  INPUT_SUBDIR: 'Imgs1'
  TARGET_SUBDIR: 'clear'
  EDGE_SUBDIR: ''
  MAX_IMAGES_PER_TRAIN_DIR: 100
  VAL_SPLIT: 0.1
  NUM_WORKERS: 0
  SEED: 42
  USE_AMP: True
  CUDNN_BENCHMARK: False
  CUDNN_DETERMINISTIC: True
  SAVE_BEST: True
  SAVE_BEST_EVERY: 1
  SAVE_OPTIMIZER: True
  SAVE_DIR: 'H:/C3Netqing/Deblurring/checkpoints/train'

AUGMENT:
  ENABLE: True
  COLOR_PROB: 0.3
  BRIGHTNESS: 0.15
  CONTRAST: 0.15
  SATURATION: 0.15
  HUE: 0.02
  GAMMA_PROB: 0.3
  GAMMA_MIN: 0.85
  GAMMA_MAX: 1.20
  INPUT_NOISE_PROB: 0.10
  INPUT_NOISE_STD: 0.010
  LOW_LIGHT_PROB: 0.0

LOSS:
  STAGE_WEIGHTS: [1.0, 0.5, 0.25]
  EDGE_WEIGHT: 0.00
  DISTILL_WEIGHT: 0.00
  STRIPE_CONSISTENCY_WEIGHT: 0.00
  FREQUENCY_CONSISTENCY_WEIGHT: 0.00

DISTILL:
  ENABLE: False
  TEACHER_WEIGHTS: ''
  TEACHER_N_FEAT: 96
  TEACHER_SCALE_UNETFEATS: 48
  TEACHER_SCALE_ORSNETFEATS: 32
  TEACHER_NUM_CAB: 8
  TEACHER_EDGE_REFINE: False
  TEACHER_EDGE_REFINE_MID: 24
  TEACHER_AMP: False
