GPU: [0]

VERBOSE: True

# TFR-Net v2: pair image supervision + recursive terminal residual refiner.
# The student is trained from scratch; TPT+AF is used only as a teacher signal.
MODEL:
  MODE: 'Deblurring'
  SESSION: 'TFR_Net_v2_Fast100_TPTTeacher'
  N_FEAT: 96
  SCALE_UNETFEATS: 48
  SCALE_ORSNETFEATS: 32
  NUM_CAB: 8

  EDGE_REFINE: False
  LIGHT_ADAPT: False
  TRAJECTORY_LIGHTWEIGHT: False
  STAGE1_TRISTRIPE: True
  STAGE1_STRIPES: 3
  STAGE1_OVERLAP: 0.20
  STAGE2_PAIR_ALIGNED: True

  TRISTRIPE_CONTEXT_PYRAMID: True
  TRISTRIPE_CONTEXT_BLOCKS: 3
  HORIZONTAL_TRAJECTORY_BLOCKS: True

  TFR_NET_CORE: True
  TFR_BLOCKS: 8
  TFR_HORIZONTAL_KERNEL: 15
  TFR_VERTICAL_KERNEL: 5
  TFR_REFINER_STEPS: 3

  FREQUENCY_REFINE: True
  FREQUENCY_REFINE_HIDDEN: 16
  FREQUENCY_BAND_GATE: True
  FREQUENCY_BAND_LOW_START: 0.05
  FREQUENCY_BAND_LOW_END: 0.10
  FREQUENCY_BAND_HIGH_START: 0.30
  FREQUENCY_BAND_HIGH_END: 0.40
  FREQUENCY_DISAGREEMENT_GATE: False

OPTIM:
  BATCH_SIZE: 2
  NUM_EPOCHS: 25
  LR_INITIAL: 2.0e-4
  LR_MIN: 1.0e-6
  ACCUM_ITERS: 4

TRAINING:
  VAL_AFTER_EVERY: 5
  CHECKPOINT_EVERY: 5
  DO_VALIDATE: True
  RESUME: False
  FINETUNE: False
  PRETRAINED_PATH: ''
  TRAIN_PS: 320
  VAL_PS: 320
  TRAIN_DIR: ''
  VAL_DIR: ''
  TRAIN_DIRS:
    - 'H:/DATASET/DB/train'
    - 'H:/DATASET/XJ/train'
    - 'H:/DATASET/SD/train'
  VAL_DIRS: []
  INPUT_SUBDIR: 'Imgs1'
  TARGET_SUBDIR: 'clear'
  EDGE_SUBDIR: ''
  MAX_IMAGES_PER_TRAIN_DIR: 100
  VAL_SPLIT: 0.1
  NUM_WORKERS: 2
  SEED: 42
  USE_AMP: True
  CUDNN_BENCHMARK: True
  CUDNN_DETERMINISTIC: False
  SAVE_BEST: True
  SAVE_BEST_EVERY: 1
  SAVE_OPTIMIZER: False
  SAFE_CHECKPOINTS: True
  SAVE_DIR: 'H:/C3Netqing/Deblurring/checkpoints/train'

AUGMENT:
  ENABLE: True
  COLOR_PROB: 0.3
  BRIGHTNESS: 0.15
  CONTRAST: 0.15
  SATURATION: 0.15
  HUE: 0.02
  GAMMA_PROB: 0.3
  GAMMA_MIN: 0.85
  GAMMA_MAX: 1.20
  INPUT_NOISE_PROB: 0.10
  INPUT_NOISE_STD: 0.010
  LOW_LIGHT_PROB: 0.0

LOSS:
  STAGE_WEIGHTS: [1.0, 0.5, 0.25]
  EDGE_WEIGHT: 0.00
  DISTILL_WEIGHT: 0.10
  STRIPE_CONSISTENCY_WEIGHT: 0.00
  FREQUENCY_CONSISTENCY_WEIGHT: 0.00
  STRUCTURE_TEXTURE_WEIGHT: 0.00

DISTILL:
  ENABLE: True
  TEACHER_CONFIG: 'H:/C3Netqing/Deblurring/training_tpt_net_bandgate_fast100.yml'
  TEACHER_WEIGHTS: 'H:/C3Netqing/Deblurring/checkpoints/train/Deblurring/models/TPT_Net_BandGate_Fast100/model_best.pth'
  TEACHER_AMP: False
