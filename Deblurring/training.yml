
GPU: [0]

VERBOSE: True

MODEL:
  MODE: 'Deblurring'
  SESSION: 'LMPRNet_TrajectoryPair_NAF2_OV020_KD020'
  N_FEAT: 80
  SCALE_UNETFEATS: 40
  SCALE_ORSNETFEATS: 24
  NUM_CAB: 6
  EDGE_REFINE: True
  EDGE_REFINE_MID: 24
  LIGHT_ADAPT: True
  LIGHT_TARGET_LUMA: 0.50
  LIGHT_MIN_GAIN: 0.75
  LIGHT_MAX_GAIN: 1.80
  LIGHT_MIN_GAMMA: 0.65
  LIGHT_MAX_GAMMA: 1.35
  LIGHT_BLEND: 0.75
  LIGHT_DARK_THRESHOLD: 0.45
  LIGHT_BRIGHT_THRESHOLD: 0.70
  TRAJECTORY_LIGHTWEIGHT: True
  STAGE1_STRIPES: 3
  STAGE1_OVERLAP: 0.20
  STAGE2_NAF_BLOCKS: 2
  STAGE2_HORIZONTAL_KERNEL: 15
  STAGE2_VERTICAL_KERNEL: 5
  STAGE3_NAF_BLOCKS: 2

# Optimization arguments.
OPTIM:
  # Stage 2 KD fine-tuning from the 20-epoch NoKD trajectory-pair model.
  # ACCUM_ITERS=4 preserves the effective batch size of 8.
  BATCH_SIZE: 2
  NUM_EPOCHS: 40
  # NEPOCH_DECAY: [10]
  LR_INITIAL: 5e-5
  LR_MIN: 1e-6
  ACCUM_ITERS: 4
  # BETA1: 0.9

TRAINING:
  VAL_AFTER_EVERY: 20
  CHECKPOINT_EVERY: 10
  DO_VALIDATE: True
  RESUME: True
  FINETUNE: False
  PRETRAINED_PATH: 'H:/C3Netqing/Deblurring/checkpoints/train/Deblurring/models/LMPRNet_TrajectoryPair_NAF2_OV020_NoKD/model_latest.pth'
  TRAIN_PS: 320
  VAL_PS: 320
  TRAIN_DIR: ''
  VAL_DIR: ''
  TRAIN_DIRS:
    - 'H:/DATASET/DB/train'
    - 'H:/DATASET/XJ/train'
    - 'H:/DATASET/SD/train'
  VAL_DIRS: []
  INPUT_SUBDIR: 'Imgs1'
  TARGET_SUBDIR: 'clear'
  EDGE_SUBDIR: 'Edges'
  VAL_SPLIT: 0.1
  NUM_WORKERS: 0
  SEED: 42
  USE_AMP: True
  SAVE_BEST: False
  SAVE_BEST_EVERY: 1
  SAVE_DIR: 'H:/C3Netqing/Deblurring/checkpoints/train'
  # SAVE_IMAGES: False

# Stronger paired augmentations improve cross-domain restoration.
# They are useful when RX has different lighting, color tone, texture, or camera response
# from DB/XJ/SD. Color/gamma transforms are applied to both input and clear target;
# noise is applied only to the degraded input.
AUGMENT:
  ENABLE: True
  COLOR_PROB: 0.7
  BRIGHTNESS: 0.25
  CONTRAST: 0.25
  SATURATION: 0.30
  HUE: 0.03
  GAMMA_PROB: 0.5
  GAMMA_MIN: 0.70
  GAMMA_MAX: 1.50
  INPUT_NOISE_PROB: 0.25
  INPUT_NOISE_STD: 0.015
  LOW_LIGHT_PROB: 0.35
  LOW_LIGHT_FACTOR_MIN: 0.35
  LOW_LIGHT_FACTOR_MAX: 0.85
  LOW_LIGHT_GAMMA_MIN: 1.10
  LOW_LIGHT_GAMMA_MAX: 1.80

LOSS:
  # Outputs are [stage3, stage2, stage1]. The final image is what detection uses,
  # so it receives the largest weight.
  STAGE_WEIGHTS: [1.0, 0.5, 0.25]
  EDGE_WEIGHT: 0.02
  DISTILL_WEIGHT: 0.20

DISTILL:
  ENABLE: True
  TEACHER_WEIGHTS: 'H:/C3Netqing/Deblurring/checkpoints/train/Deblurring/models/MPRNet/model_latest.pth'
  TEACHER_N_FEAT: 96
  TEACHER_SCALE_UNETFEATS: 48
  TEACHER_SCALE_ORSNETFEATS: 32
  TEACHER_NUM_CAB: 8
