GPU: [0]

VERBOSE: True

# Memory-safe fast screening for TFR-Net v2 on Controlled-SynBlur-v1.
# This is NOT the final fair setting. It is only for quick trend checking.
MODEL:
  MODE: 'Deblurring'
  SESSION: 'TFR_Net_v2_ControlledSynBlurV1_Fast15_MemSafe_NoKD'
  N_FEAT: 96
  SCALE_UNETFEATS: 48
  SCALE_ORSNETFEATS: 32
  NUM_CAB: 8

  EDGE_REFINE: False
  LIGHT_ADAPT: False
  TRAJECTORY_LIGHTWEIGHT: False
  STAGE1_TRISTRIPE: True
  STAGE1_STRIPES: 3
  STAGE1_OVERLAP: 0.20
  STAGE2_PAIR_ALIGNED: True

  TRISTRIPE_CONTEXT_PYRAMID: True
  TRISTRIPE_CONTEXT_BLOCKS: 3
  HORIZONTAL_TRAJECTORY_BLOCKS: True

  TFR_NET_CORE: True
  TFR_BLOCKS: 8
  TFR_HORIZONTAL_KERNEL: 15
  TFR_VERTICAL_KERNEL: 5
  TFR_REFINER_STEPS: 3

  FREQUENCY_REFINE: True
  FREQUENCY_REFINE_HIDDEN: 16
  FREQUENCY_BAND_GATE: True
  FREQUENCY_BAND_LOW_START: 0.05
  FREQUENCY_BAND_LOW_END: 0.10
  FREQUENCY_BAND_HIGH_START: 0.30
  FREQUENCY_BAND_HIGH_END: 0.40
  FREQUENCY_DISAGREEMENT_GATE: False

OPTIM:
  BATCH_SIZE: 1
  NUM_EPOCHS: 15
  LR_INITIAL: 2.0e-4
  LR_MIN: 1.0e-6
  ACCUM_ITERS: 4

TRAINING:
  VAL_AFTER_EVERY: 5
  CHECKPOINT_EVERY: 5
  DO_VALIDATE: True
  RESUME: True
  FINETUNE: False
  PRETRAINED_PATH: ''
  TRAIN_PS: 256
  VAL_PS: 256
  TRAIN_DIR: ''
  VAL_DIR: ''
  TRAIN_DIRS:
    - 'H:/DATASET/ControlledSynBlurV1_TFR/DB/train'
    - 'H:/DATASET/ControlledSynBlurV1_TFR/XJ/train'
    - 'H:/DATASET/ControlledSynBlurV1_TFR/SD/train'
  VAL_DIRS:
    - 'H:/DATASET/ControlledSynBlurV1_TFR/DB/val'
    - 'H:/DATASET/ControlledSynBlurV1_TFR/XJ/val'
    - 'H:/DATASET/ControlledSynBlurV1_TFR/SD/val'
  INPUT_SUBDIR: 'input'
  TARGET_SUBDIR: 'clear'
  EDGE_SUBDIR: ''
  # Fast screening: 360 pairs per domain instead of full 1080.
  # Keep full config for final fair training.
  MAX_IMAGES_PER_TRAIN_DIR: 360
  VAL_SPLIT: 0.0
  NUM_WORKERS: 0
  SEED: 42
  USE_AMP: True
  CUDNN_BENCHMARK: True
  CUDNN_DETERMINISTIC: False
  SAVE_BEST: True
  SAVE_BEST_EVERY: 1
  SAVE_OPTIMIZER: False
  SAFE_CHECKPOINTS: True
  SAVE_DIR: 'H:/C3Netqing/Deblurring/checkpoints/train'

AUGMENT:
  ENABLE: False
  COLOR_PROB: 0.0
  BRIGHTNESS: 0.0
  CONTRAST: 0.0
  SATURATION: 0.0
  HUE: 0.0
  GAMMA_PROB: 0.0
  GAMMA_MIN: 1.0
  GAMMA_MAX: 1.0
  INPUT_NOISE_PROB: 0.0
  INPUT_NOISE_STD: 0.0
  LOW_LIGHT_PROB: 0.0

LOSS:
  STAGE_WEIGHTS: [1.0, 0.5, 0.25]
  EDGE_WEIGHT: 0.00
  DISTILL_WEIGHT: 0.00
  STRIPE_CONSISTENCY_WEIGHT: 0.00
  FREQUENCY_CONSISTENCY_WEIGHT: 0.00
  STRUCTURE_TEXTURE_WEIGHT: 0.00

DISTILL:
  ENABLE: False
  TEACHER_CONFIG: ''
  TEACHER_WEIGHTS: ''
  TEACHER_AMP: False
