GPU: [0]

VERBOSE: True

MODEL:
  MODE: 'Deblurring'
  SESSION: 'MPRNet_TriStripe_ORS_EdgeKD'
  # Keep the successful EdgeFT capacity so its checkpoint can be loaded.
  N_FEAT: 96
  SCALE_UNETFEATS: 48
  SCALE_ORSNETFEATS: 32
  NUM_CAB: 8
  EDGE_REFINE: True
  EDGE_REFINE_MID: 24
  LIGHT_ADAPT: False
  # New hybrid path: tri-stripe Stage 1 + original MPRNet Stage 2/3.
  TRAJECTORY_LIGHTWEIGHT: False
  STAGE1_TRISTRIPE: True
  STAGE1_STRIPES: 3
  STAGE1_OVERLAP: 0.20
  STAGE2_OVERLAP: 0.10

OPTIM:
  # A full EdgeFT student plus frozen EdgeFT teacher is close to 24 GB at
  # batch 4. Keep the effective batch at 8 while reducing peak VRAM.
  BATCH_SIZE: 2
  NUM_EPOCHS: 40
  LR_INITIAL: 1.0e-5
  LR_MIN: 1.0e-6
  ACCUM_ITERS: 4

TRAINING:
  VAL_AFTER_EVERY: 5
  CHECKPOINT_EVERY: 5
  DO_VALIDATE: True
  # Continue safely from the valid epoch-1 checkpoint in this session.
  RESUME: True
  FINETUNE: False
  PRETRAINED_PATH: 'H:/C3Netqing/Deblurring/checkpoints/train/Deblurring/models/MPRNet_EdgeFT/model_best.pth'
  TRAIN_PS: 320
  VAL_PS: 320
  TRAIN_DIR: ''
  VAL_DIR: ''
  TRAIN_DIRS:
    - 'H:/DATASET/DB/train'
    - 'H:/DATASET/XJ/train'
    - 'H:/DATASET/SD/train'
  VAL_DIRS: []
  INPUT_SUBDIR: 'Imgs1'
  TARGET_SUBDIR: 'clear'
  EDGE_SUBDIR: 'Edges'
  VAL_SPLIT: 0.1
  NUM_WORKERS: 0
  SEED: 42
  USE_AMP: True
  # Avoid cuDNN's dynamically selected inference algorithm, which crashed
  # in cudnn_cnn_infer64_8.dll during the prior KD run.
  CUDNN_BENCHMARK: False
  CUDNN_DETERMINISTIC: True
  SAVE_BEST: True
  SAVE_BEST_EVERY: 1
  SAVE_DIR: 'H:/C3Netqing/Deblurring/checkpoints/train'

AUGMENT:
  ENABLE: True
  COLOR_PROB: 0.3
  BRIGHTNESS: 0.15
  CONTRAST: 0.15
  SATURATION: 0.15
  HUE: 0.02
  GAMMA_PROB: 0.3
  GAMMA_MIN: 0.85
  GAMMA_MAX: 1.20
  INPUT_NOISE_PROB: 0.10
  INPUT_NOISE_STD: 0.010
  LOW_LIGHT_PROB: 0.0

LOSS:
  STAGE_WEIGHTS: [1.0, 0.5, 0.25]
  EDGE_WEIGHT: 0.02
  DISTILL_WEIGHT: 0.05
  # Keeps the two shared-pair decoders consistent in their common stripe region.
  STRIPE_CONSISTENCY_WEIGHT: 0.01

DISTILL:
  # Teacher is the same strong EdgeFT model, present from fine-tuning epoch 1.
  ENABLE: True
  TEACHER_WEIGHTS: 'H:/C3Netqing/Deblurring/checkpoints/train/Deblurring/models/MPRNet_EdgeFT/model_best.pth'
  TEACHER_N_FEAT: 96
  TEACHER_SCALE_UNETFEATS: 48
  TEACHER_SCALE_ORSNETFEATS: 32
  TEACHER_NUM_CAB: 8
  TEACHER_EDGE_REFINE: True
  TEACHER_EDGE_REFINE_MID: 24
  # Student remains AMP-enabled; the frozen teacher uses stable FP32 inference.
  TEACHER_AMP: False
