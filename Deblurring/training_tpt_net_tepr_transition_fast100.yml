GPU: [0]

VERBOSE: True

# Transition-only run. The frozen HSGORS-v2 recovery branch is present while
# alpha ramps to 1, then remains unused. Do not use this checkpoint as final.
MODEL:
  MODE: 'Deblurring'
  SESSION: 'TPT_Net_TEPR_Transition_Fast100'
  N_FEAT: 96
  SCALE_UNETFEATS: 48
  SCALE_ORSNETFEATS: 32
  NUM_CAB: 8
  EDGE_REFINE: False
  LIGHT_ADAPT: False
  TRAJECTORY_LIGHTWEIGHT: False
  STAGE1_TRISTRIPE: True
  STAGE1_STRIPES: 3
  STAGE1_OVERLAP: 0.20
  STAGE2_OVERLAP: 0.0
  STAGE2_PAIR_ALIGNED: True
  STAGE2_TMT: True
  STAGE2_TMT_HORIZONTAL_KERNEL: 15
  STAGE2_TMT_VERTICAL_KERNEL: 5
  GATED_CSFF: True
  GATED_CSFF_HORIZONTAL_KERNEL: 7
  HSGORS_V2: False
  STAGE3_TRR: False
  STAGE3_TEPR: True
  STAGE3_TEPR_TRANSITION: True
  STAGE3_TEPR_FREEZE_LEGACY: True
  STAGE3_TEPR_BLOCKS: 3
  STAGE3_TEPR_HORIZONTAL_KERNEL: 15
  STAGE3_TEPR_VERTICAL_KERNEL: 5
  FREQUENCY_REFINE: True
  FREQUENCY_REFINE_HIDDEN: 16
  FREQUENCY_BAND_GATE: True
  FREQUENCY_BAND_LOW_START: 0.05
  FREQUENCY_BAND_LOW_END: 0.10
  FREQUENCY_BAND_HIGH_START: 0.30
  FREQUENCY_BAND_HIGH_END: 0.40
  FREQUENCY_DISAGREEMENT_GATE: False

OPTIM:
  BATCH_SIZE: 1
  NUM_EPOCHS: 25
  LR_INITIAL: 5.0e-6
  LR_MIN: 5.0e-7
  ACCUM_ITERS: 8
  FREQUENCY_LR_MULTIPLIER: 3.0
  STAGE2_TMT_LR_MULTIPLIER: 2.0
  STAGE3_TEPR_LR_MULTIPLIER: 12.0

TRAINING:
  VAL_AFTER_EVERY: 3
  CHECKPOINT_EVERY: 5
  DO_VALIDATE: True
  RESUME: False
  FINETUNE: True
  PRETRAINED_PATH: 'H:/C3Netqing/Deblurring/checkpoints/train/Deblurring/models/TPT_Net_BandGate_Stage2TMT_HSGORSv2_Fast100/model_latest.pth'
  STAGE3_TEPR_TRANSITION_EPOCHS: 12
  TRAIN_PS: 320
  VAL_PS: 320
  TRAIN_DIR: ''
  VAL_DIR: ''
  TRAIN_DIRS:
    - 'H:/DATASET/DB/train'
    - 'H:/DATASET/XJ/train'
    - 'H:/DATASET/SD/train'
  VAL_DIRS: []
  INPUT_SUBDIR: 'Imgs1'
  TARGET_SUBDIR: 'clear'
  EDGE_SUBDIR: ''
  MAX_IMAGES_PER_TRAIN_DIR: 100
  VAL_SPLIT: 0.1
  NUM_WORKERS: 0
  SEED: 42
  USE_AMP: True
  CUDNN_BENCHMARK: False
  CUDNN_DETERMINISTIC: True
  SAVE_BEST: True
  SAVE_BEST_EVERY: 1
  SAVE_OPTIMIZER: True
  SAVE_DIR: 'H:/C3Netqing/Deblurring/checkpoints/train'

AUGMENT:
  ENABLE: True
  COLOR_PROB: 0.3
  BRIGHTNESS: 0.15
  CONTRAST: 0.15
  SATURATION: 0.15
  HUE: 0.02
  GAMMA_PROB: 0.3
  GAMMA_MIN: 0.85
  GAMMA_MAX: 1.20
  INPUT_NOISE_PROB: 0.10
  INPUT_NOISE_STD: 0.010
  LOW_LIGHT_PROB: 0.0

LOSS:
  STAGE_WEIGHTS: [1.0, 0.5, 0.25]
  EDGE_WEIGHT: 0.00
  DISTILL_WEIGHT: 0.00
  STRIPE_CONSISTENCY_WEIGHT: 0.00
  FREQUENCY_CONSISTENCY_WEIGHT: 0.00

DISTILL:
  ENABLE: False
  TEACHER_WEIGHTS: ''
  TEACHER_AMP: False
